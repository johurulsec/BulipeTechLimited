<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Browser Chrome -->
    <div class="browser-chrome">
        <div class="tab-bar">
            <div class="tab">            
                <div class="tab-icon">N</div>
                <span>New Tab</span>
                <div class="tab-close">×</div>
            </div>

            <!-- <button class="new-tab-btn">+</button>
             <input type="" class="new-tab" id="tabPlusInput"> -->
            <button class="new-tab-btn" onclick="performNewTab()" id="tabPlusInput">+</button>
            <div class="window-controls">
                <button class="window-btn">−</button>
                <button class="window-btn">□</button>
                <button class="window-btn close-btn">×</button>
            </div>
        </div>

        <div class="nav-controls">
            <button class="nav-btn" disabled>←</button>
            <button class="nav-btn" disabled>→</button>
            <button class="nav-btn">↻</button>
            <input type="text" class="address-bar" placeholder="search here or enter address">
            <div class="browser-actions">
                <button class="nav-btn">⋆</button>
                <button class="nav-btn">⚙</button>
                <button class="nav-btn">⋮</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="logo-container">
            <div class="logo-icon">N</div>
            <div class="logo-text">Nicdora</div>
        </div>

        <div class="search-container">
            <input type="text" class="search-box" placeholder="search here or enter address" id="searchInput">
            <div class="search-icons">
                <div class="search-icon">🎤</div>
                <!-- <div class="search-icon">🔍</div> -->
                <button class="search-btn" onclick="performSearch()">🔍</button>
            </div>
        </div>

        <div class="shortcuts-container">
            <div class="shortcut">
                <div class="shortcut-icon google-icon">G</div>
                <div class="shortcut-label">Google</div>
            </div>

            <div class="shortcut">
                <div class="shortcut-icon gmail-icon">✉</div>
                <div class="shortcut-label">Gmail</div>
            </div>

            <div class="shortcut">
                <div class="shortcut-icon facebook-icon">f</div>
                <div class="shortcut-label">Facebook</div>
            </div>

            <div class="shortcut">
                <div class="shortcut-icon add-icon">+</div>
                <div class="shortcut-label">Add a Shortcut</div>
            </div>
        </div>
    </div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        let browser;

        new QWebChannel(qt.webChannelTransport, function(channel) {
            browser = channel.objects.browserInterface;
        });

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query && browser) {
                browser.searchRequested(query);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });

        // for new tab
        function performNewTab() {
            //const query = document.getElementById('tabPlusInput').value.trim();
            const query = "https://www.google.com";
            if (query && browser) {
                browser.searchRequested(query);
            }
        }

        document.getElementById('tabPlusInput').addEventListener('keypress', function(e) {
            performNewTab();
        });

    </script>

</body>
</html>
