<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>  

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            top: 10%;
            left: 20%;
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            top: 70%;
            right: 15%;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 20%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            bottom: 20%;
            left: 10%;
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 30%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .time-display {
            font-size: 4rem;
            font-weight: 300;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
            animation: fadeIn 1s ease-out;
        }

        .date-display {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
            text-shadow: 0 1px 10px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 50px;
            position: relative;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .search-box {
            width: 100%;
            padding: 20px 60px 20px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            outline: none;
        }

        .search-box:focus {
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            background: rgba(255,255,255,1);
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 15px 20px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .search-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            max-width: 800px;
            width: 100%;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .quick-link {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .quick-link:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.25);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .quick-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .quick-link:hover::before {
            left: 100%;
        }

        .quick-link-icon {
            font-size: 24px;
            margin-bottom: 10px;
            display: block;
        }

        .quick-link-text {
            font-size: 14px;
            font-weight: 500;
        }

        .weather-widget {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 15px;
            color: white;
            font-size: 14px;
            text-align: center;
            animation: slideDown 0.8s ease-out 0.8s both;
        }

        .settings-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 1s ease-out 1s both;
        }

        .settings-btn:hover {
            transform: rotate(90deg) scale(1.1);
            background: rgba(255,255,255,0.25);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .time-display {
                font-size: 3rem;
            }

            .quick-links {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 15px;
            }

            .weather-widget {
                position: relative;
                top: auto;
                right: auto;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>    

    <div class="bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="weather-widget" id="weather">
        <div>🌤️ 24°C</div>
        <div>Partly Cloudy</div>
    </div>

    <div class="container">
        <div class="time-display" id="time"></div>
        <div class="date-display" id="date"></div>

        <div class="search-container">
            <input type="text" class="search-box" placeholder="Search the web or enter a URL..." id="searchInput">
            <button class="search-btn" onclick="performSearch()">🔍</button>
        </div>

        <div class="quick-links">
            <a href="#" class="quick-link" onclick="openSite('https://gmail.com')">
                <span class="quick-link-icon">📧</span>
                <div class="quick-link-text">Gmail</div>
            </a>
            <a href="#" class="quick-link" onclick="openSite('https://youtube.com')">
                <span class="quick-link-icon">📺</span>
                <div class="quick-link-text">YouTube</div>
            </a>
            <a href="#" class="quick-link" onclick="openSite('https://github.com')">
                <span class="quick-link-icon">💻</span>
                <div class="quick-link-text">GitHub</div>
            </a>
            <a href="#" class="quick-link" onclick="openSite('https://reddit.com')">
                <span class="quick-link-icon">🔗</span>
                <div class="quick-link-text">Reddit</div>
            </a>
            <a href="#" class="quick-link" onclick="openSite('https://twitter.com')">
                <span class="quick-link-icon">🐦</span>
                <div class="quick-link-text">Twitter</div>
            </a>
            <a href="#" class="quick-link" onclick="openSite('https://linkedin.com')">
                <span class="quick-link-icon">💼</span>
                <div class="quick-link-text">LinkedIn</div>
            </a>
        </div>
    </div>

    <div class="settings-btn" onclick="toggleSettings()">⚙️</div>    
    
    <script>
        // Update time and date
        function updateTime() {
            const now = new Date();
            const timeElement = document.getElementById('time');
            const dateElement = document.getElementById('date');

            const timeString = now.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            const dateString = now.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            timeElement.textContent = timeString;
            dateElement.textContent = dateString;
        }

        // Search functionality

            if (query) {

                    // Search with Google

-->
        // Open site function
        function openSite(url) {
            window.open(url, '_blank');
        }

        // Settings toggle (placeholder)
        function toggleSettings() {
            alert('Settings panel would open here! This could include:\n• Background themes\n• Quick link customization\n• Weather location\n• Search engine preference');
        }

        // Enter key support for search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Initialize
        updateTime();
        setInterval(updateTime, 1000);

        // Focus search box on load
        window.addEventListener('load', function() {
            document.getElementById('searchInput').focus();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + K to focus search
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });
    </script>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        let browser;

        new QWebChannel(qt.webChannelTransport, function(channel) {
            browser = channel.objects.browserInterface;
        });

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query && browser) {
                browser.searchRequested(query);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });
    </script>

</body>
</html>
